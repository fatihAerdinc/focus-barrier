<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Barrier — Permanent Block</title>
  <style>
    :root {
      --bg: #1a1e26; --panel: #262e3c; --txt: #e8eaf0; --lbl: #8da1b9;
      --pri: #337ab7; --pri-b: #23527c; --rad: 12px;
      --danger: #d9534f; --danger-b: #8a2f2d;
      --brick-color: #337ab7; --brick-shadow: #23527c;
    }

    body {
      display: flex; justify-content: center; align-items: center; height: 100vh;
      font-family: system-ui, sans-serif; background: var(--bg); color: var(--txt);
      margin: 0; text-align: center;
    }

    .card {
      background: var(--panel); padding: 40px; border-radius: var(--rad);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6); width: 360px;
      border: 1px solid #3c4a5c;
    }

    h1 { margin: 0; font-size: 2.2rem; font-weight: 800; }

    #subtitle {
      color: var(--lbl); font-size: 1rem; margin: 15px 0 25px; line-height: 1.5;
    }
    #subtitle strong { color: #fff; border-bottom: 2px solid var(--danger); }

    /* ── Brick animation (matches pause.html) ── */
    .brick-wall {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 4px; width: 120px; margin: 0 auto 24px;
    }
    .brick {
      width: 100%; height: 12px; background: var(--brick-color);
      border-radius: 2px; opacity: 0;
      box-shadow: inset 0 -2px 0 var(--brick-shadow);
      animation: buildBrick 4s infinite;
    }
    @keyframes buildBrick {
      0%,10%  { opacity:0; transform:scale(0.8); }
      20%,80% { opacity:1; transform:scale(1);   }
      90%,100%{ opacity:0; transform:scale(0.8); }
    }
    .brick:nth-child(1)  { animation-delay:0.1s; }
    .brick:nth-child(2)  { animation-delay:0.2s; }
    .brick:nth-child(3)  { animation-delay:0.3s; }
    .brick:nth-child(4)  { animation-delay:0.4s; }
    .brick:nth-child(5)  { animation-delay:0.5s; }
    .brick:nth-child(6)  { animation-delay:0.6s; }
    .brick:nth-child(7)  { animation-delay:0.7s; }
    .brick:nth-child(8)  { animation-delay:0.8s; }
    .brick:nth-child(9)  { animation-delay:0.9s; }
    .brick:nth-child(10) { animation-delay:1.0s; }
    .brick:nth-child(11) { animation-delay:1.1s; }
    .brick:nth-child(12) { animation-delay:1.2s; }

    #countdown {
      margin: 10px 0 0;
      font-weight: 600;
      color: var(--danger);
      min-height: 20px;
    }

    .footer-hint {
      margin-top: 10px;
      color: var(--lbl);
      font-size: 0.86rem;
      line-height: 1.35;
    }
    .footer-hint .gear { margin-right: 6px; }

    button {
      width: 100%; padding: 15px; font-size: 1.1rem; border-radius: 8px;
      font-weight: 700; cursor: pointer; transition: all 0.05s;
      margin-bottom: 12px; border: 1px solid transparent; text-transform: uppercase;
    }

    #close {
      background: var(--danger);
      color: #fff;
      border-bottom: 6px solid var(--danger-b);
    }
    #close:active { transform: translateY(3px); border-bottom-width: 2px; }

    /* No settings button on block pages (intentional). */
  </style>
</head>
<body>
  <div class="card">
    <div class="brick-wall">
      <div class="brick"></div><div class="brick"></div>
      <div class="brick"></div><div class="brick"></div>
      <div class="brick"></div><div class="brick"></div>
      <div class="brick"></div><div class="brick"></div>
      <div class="brick"></div><div class="brick"></div>
      <div class="brick"></div><div class="brick"></div>
    </div>
    <h1>Focus Barrier</h1>
    <p id="subtitle">This domain is hard-blocked.</p>
    <button id="close">Close tab</button>
    <div id="countdown">Auto closing in 30 seconds…</div>
    <div class="footer-hint">If you wish to remove this block, go to <span class="gear">⚙</span>settings.</div>
  </div>
  <script src="mega.js"></script>
</body>
</html>
